# EODHD demo — TSLA pure-HA pattern reversal after a streak.
# Real-data counterpart of tst2020-ha-streak-backtest.toml.
#   export EODHD_API_TOKEN=demo
#   java -jar target/wichtelm.jar run demo/eodhd-tsla-ha-streak.toml
# [date_range] tracks the demo token's rolling recent slice — see demo/README.md.

strategy    = "strategies/ha-streak-reversal.strat"
symbol      = "TSLA.US"
data_source = "eodhd"

[date_range]
from = 2026-01-27
to   = 2026-05-21

[sizing]
position_size_pct = 50
pyramiding        = false

[parameters]
streak_length   = 12
stop_loss_pct   = 1.5
take_profit_pct = 4

[eodhd]
api_token_env = "EODHD_API_TOKEN"
