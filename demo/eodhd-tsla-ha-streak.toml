# EODHD demo — TSLA pure-HA pattern reversal after streak (H2 2023).
# Real-data counterpart of tst2020-ha-streak-backtest.toml.
#   export EODHD_API_TOKEN=demo
#   java -jar target/wichtelm.jar run demo/eodhd-tsla-ha-streak.toml

strategy    = "strategies/ha-streak-reversal.strat"
symbol      = "TSLA.US"
data_source = "eodhd"

[date_range]
from = 2023-07-01
to   = 2023-12-31

[sizing]
position_size_pct = 50
pyramiding        = false

[parameters]
streak_length   = 12
stop_loss_pct   = 1.5
take_profit_pct = 4

[eodhd]
api_token_env = "EODHD_API_TOKEN"
