# Showcase demo (not profit-tuned) — MACD numeric+cross, ha_doji/ha_strong,
# highest_close/lowest_close, avg_volume, atr_value stop — on the synthetic
# EQUITY TSTX, ~2 years of daily bars.
strategy    = "strategies/showcase-macd-ha.strat"
symbol      = "TSTX"
data_source = "csv"
[date_range]
from = 2021-06-01
to   = 2023-06-01
[sizing]
position_size_pct = 50
pyramiding        = false
[output]
directory = "reports"
[csv]
file = "data/{symbol}_{timeframe}.csv"
