# wichtelm-app TST2020 backtest — daily pivot-point breakout demo, showcasing
# the ha-track 0.52 INC3 pivot primitives (price_crosses_above_pivot(R1) entry,
# price_crosses_below_pivot(P) exit) against the synthetic TST2020 (COVID year)
# dataset. Run from the repository root:
#   wichtelm run demo/tst2020-pivot-backtest.toml
# Paths below are resolved relative to this config file (the demo/ directory).

strategy    = "strategies/pivot-breakout.strat"
symbol      = "TST2020"
data_source = "csv"

[date_range]
from = 2020-01-01
to   = 2020-12-31

[sizing]
position_size_pct = 50
pyramiding        = false

[output]
directory = "reports"

[csv]
file = "data/{symbol}_{timeframe}.csv"
