# Heikin-Ashi reversals at RSI extremes on the synthetic CRYPTO TSTC (24/7) —
# a two-month window of hourly bars (short, so the trade list stays readable).
strategy    = "strategies/ha-reversal.strat"
symbol      = "TSTC"
data_source = "csv"
[date_range]
from = 2022-03-01
to   = 2022-04-30
[sizing]
position_size_pct = 50
pyramiding        = false
[output]
directory = "reports"
[csv]
file = "data/{symbol}_{timeframe}.csv"
