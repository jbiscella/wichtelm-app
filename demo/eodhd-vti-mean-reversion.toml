# EODHD demo — VTI mean reversion in the broad market.
# Real-data counterpart of tst2020-backtest.toml.
#   export EODHD_API_TOKEN=demo
#   java -jar target/wichtelm.jar run demo/eodhd-vti-mean-reversion.toml
# [date_range] tracks the demo token's rolling recent slice — see demo/README.md.

strategy    = "strategies/mean-reversion-trend.strat"
symbol      = "VTI.US"
data_source = "eodhd"

[date_range]
from = 2026-01-27
to   = 2026-05-21

[sizing]
position_size_pct = 50
pyramiding        = false

[parameters]
oversold       = 30
overbought     = 70
trend_period   = 20
stop_loss_pct  = 5

[eodhd]
api_token_env = "EODHD_API_TOKEN"
