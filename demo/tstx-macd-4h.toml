# 4h MACD momentum with an ATR stop (INC2 atr_value) and pyramiding, on TSTX,
# ~one year of 4-hour bars.
strategy    = "strategies/macd-momentum.strat"
symbol      = "TSTX"
data_source = "csv"
[date_range]
from = 2022-01-01
to   = 2022-12-31
[sizing]
position_size_pct = 40
pyramiding        = true
[output]
directory = "reports"
[csv]
file = "data/{symbol}_{timeframe}.csv"
