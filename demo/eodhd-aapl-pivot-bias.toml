# EODHD demo — AAPL daily-pivot bias, showcasing the 0.52 INC3 pivot primitives
# (price_crosses_above_pivot(P) entry, price_crosses_below_pivot(P) exit). AAPL's
# last split was Aug 2020, so any recent window is corporate-action-free and safe
# for raw intraday (demo/README.md).
#   export EODHD_API_TOKEN=demo
#   java -jar target/wichtelm.jar run demo/eodhd-aapl-pivot-bias.toml
# [date_range] tracks the demo token's rolling recent slice — see demo/README.md.

strategy    = "strategies/pivot-breakout.strat"
symbol      = "AAPL.US"
data_source = "eodhd"

[date_range]
from = 2026-01-27
to   = 2026-05-21

[sizing]
position_size_pct = 50
pyramiding        = false

[eodhd]
api_token_env = "EODHD_API_TOKEN"
