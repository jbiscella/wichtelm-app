# wichtelm-app TST2020 backtest — the HA-pattern-reversal-at-RSI-extremes
# strategy run against the synthetic TST2020 (COVID year) dataset.
# Run from the repository root:
#   wichtelm run demo/tst2020-ha-pattern-backtest.toml
# Paths below are resolved relative to this config file (the demo/ directory).

strategy    = "strategies/ha-pattern-reversal.strat"
symbol      = "TST2020"
data_source = "csv"

[date_range]
from = 2020-01-01
to   = 2020-12-31

[sizing]
position_size_pct = 50
pyramiding        = false

[parameters]
overbought_threshold = 70
oversold_threshold   = 30
doji_threshold       = 0.1
stop_loss_pct        = 1.5
take_profit_pct      = 4

[output]
directory = "reports"

[csv]
file = "data/{symbol}_{timeframe}.csv"
