# Showcase demo (not profit-tuned) — MA-filter states/crosses, rsi_crosses_50,
# pivot states, stddev — on the synthetic EQUITY TSTX, ~2 years of daily bars.
strategy    = "strategies/showcase-ma-rsi.strat"
symbol      = "TSTX"
data_source = "csv"
[date_range]
from = 2021-06-01
to   = 2023-06-01
[sizing]
position_size_pct = 50
pyramiding        = false
[output]
directory = "reports"
[csv]
file = "data/{symbol}_{timeframe}.csv"
