# wichtelm-app demo backtest.
# Run from the repository root:
#   wichtelm run demo/demo-backtest.toml
# Paths below are resolved relative to this config file (the demo/ directory).
# See demo/README.md for details.

strategy    = "strategies/mean-reversion-trend.strat"
symbol      = "DEMO"
data_source = "csv"

[date_range]
from = 2024-01-01
to   = 2024-05-01

[sizing]
position_size_pct = 50
pyramiding        = false

[parameters]
oversold   = 35
overbought = 65

[output]
directory = "reports"

[csv]
file = "data/{symbol}_{timeframe}.csv"
