# EODHD demo — TSLA HA pattern reversal at RSI extremes (H1 2023).
# Real-data counterpart of tst2020-ha-pattern-backtest.toml.
#   export EODHD_API_TOKEN=demo
#   java -jar target/wichtelm.jar run demo/eodhd-tsla-ha-pattern.toml

strategy    = "strategies/ha-pattern-reversal.strat"
symbol      = "TSLA.US"
data_source = "eodhd"

[date_range]
from = 2023-01-01
to   = 2023-06-30

[sizing]
position_size_pct = 50
pyramiding        = false

[parameters]
overbought_threshold = 70
oversold_threshold   = 30
doji_threshold       = 0.1
stop_loss_pct        = 1.5
take_profit_pct      = 4

[eodhd]
api_token_env = "EODHD_API_TOKEN"
