# wichtelm-app TST2020 backtest — MA trend filter + ATR dynamic stop demo,
# showcasing the ha-track 0.52 increments (INC1 price-vs-EMA cross primitives,
# INC2 atr_value stop) against the synthetic TST2020 (COVID year) dataset.
# Run from the repository root:
#   wichtelm run demo/tst2020-ma-atr-trend-backtest.toml
# Paths below are resolved relative to this config file (the demo/ directory).

strategy    = "strategies/ma-atr-trend.strat"
symbol      = "TST2020"
data_source = "csv"

[date_range]
from = 2020-01-01
to   = 2020-12-31

[sizing]
position_size_pct = 50
pyramiding        = false

[output]
directory = "reports"

[csv]
file = "data/{symbol}_{timeframe}.csv"
