# Local-only EODHD run — NEVER commit the generated report (licensed data; see README).
# Daily swing with a weekly channel filter (multi-timeframe) on real AAPL bars.
strategy = "strategies/swing-multi-tf.strat"
symbol = "AAPL.US"
data_source = "eodhd"
[date_range]
from = 2021-01-01
to   = 2024-06-30
[sizing]
position_size_pct = 50
pyramiding = false
[eodhd]
api_token_env = "EODHD_API_TOKEN"
