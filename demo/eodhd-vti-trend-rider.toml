# Local-only EODHD run — NEVER commit the generated report (licensed data; see README).
# Weekly trend rider on real VTI weekly bars (EOD endpoint serves full history;
# the demo token has VTI back to 2001). ~5 years.
strategy = "strategies/trend-rider.strat"
symbol = "VTI.US"
data_source = "eodhd"
[date_range]
from = 2021-01-01
to   = 2026-05-01
[sizing]
position_size_pct = 50
pyramiding = false
[eodhd]
api_token_env = "EODHD_API_TOKEN"
