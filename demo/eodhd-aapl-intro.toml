# EODHD demo — AAPL intro (mean reversion + daily trend filter).
# Real-data counterpart of demo-backtest.toml. Run on a machine with
# outbound access to eodhd.com:
#   export EODHD_API_TOKEN=demo
#   java -jar target/wichtelm.jar run demo/eodhd-aapl-intro.toml
# The free EODHD "demo" token serves AAPL.US / TSLA.US / VTI.US (and a few more).

strategy    = "strategies/mean-reversion-trend.strat"
symbol      = "AAPL.US"
data_source = "eodhd"

[date_range]
from = 2024-01-01
to   = 2024-03-31

[sizing]
position_size_pct = 50
pyramiding        = false

[parameters]
oversold   = 35
overbought = 65

[eodhd]
api_token_env = "EODHD_API_TOKEN"
