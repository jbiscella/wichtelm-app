# wichtelm-app SPX 2020 backtest — the mean-reversion-with-trend-filter
# strategy run against the synthetic SPX 2020 (COVID year) dataset.
# Run from the repository root:
#   wichtelm run demo/spx2020-backtest.toml
# Paths below are resolved relative to this config file (the demo/ directory).

strategy    = "strategies/mean-reversion-trend.strat"
symbol      = "SPX2020"
data_source = "csv"

[date_range]
from = 2020-01-01
to   = 2020-12-31

[sizing]
position_size_pct = 50
pyramiding        = false

[parameters]
oversold       = 30
overbought     = 70
trend_period   = 20
stop_loss_pct  = 5

[output]
directory = "reports"

[csv]
file = "data/{symbol}_{timeframe}.csv"
