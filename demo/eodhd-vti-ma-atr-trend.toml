# EODHD demo — VTI MA trend filter + ATR dynamic stop (broad market, Q2-Q3 2023).
# Real-data counterpart of tst2020-ma-atr-trend-backtest.toml, showcasing the
# 0.52 increments (INC1 price-vs-EMA cross primitives, INC2 atr_value stop).
# VTI is a broad ETF — split/dividend-free, so raw intraday is safe (see
# demo/README.md "Raw-data limitation").
#   export EODHD_API_TOKEN=demo
#   java -jar target/wichtelm.jar run demo/eodhd-vti-ma-atr-trend.toml

strategy    = "strategies/ma-atr-trend.strat"
symbol      = "VTI.US"
data_source = "eodhd"

[date_range]
from = 2023-04-01
to   = 2023-09-30

[sizing]
position_size_pct = 50
pyramiding        = false

[eodhd]
api_token_env = "EODHD_API_TOKEN"
