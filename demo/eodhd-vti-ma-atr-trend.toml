# EODHD demo — VTI MA trend filter + ATR dynamic stop, showcasing the 0.52
# increments (INC1 price-vs-EMA cross primitives, INC2 atr_value stop). VTI is
# a broad ETF — split/dividend-free, so raw intraday is safe (demo/README.md).
#   export EODHD_API_TOKEN=demo
#   java -jar target/wichtelm.jar run demo/eodhd-vti-ma-atr-trend.toml
# [date_range] tracks the demo token's rolling recent slice — see demo/README.md.

strategy    = "strategies/ma-atr-trend.strat"
symbol      = "VTI.US"
data_source = "eodhd"

[date_range]
from = 2026-01-27
to   = 2026-05-21

[sizing]
position_size_pct = 50
pyramiding        = false

[eodhd]
api_token_env = "EODHD_API_TOKEN"
